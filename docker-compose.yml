# Copyright 2026 Firefly Software Solutions Inc
#
# Default compose stack:  api + worker + postgres + redis
#
# Usage:
#   cp env_template .env
#   docker compose up --build

x-build: &service-build
  context: .
  dockerfile: Dockerfile
  additional_contexts:
    pyfly: ../../fireflyframework/fireflyframework-pyfly
    fireflyframework-agentic: ../../fireflyframework/fireflyframework-agentic

services:
  postgres:
    # pgvector ships an official image that bundles the ``vector``
    # extension on top of stock Postgres 16. flycanon defaults to
    # FLYCANON_VECTOR_STORE=pgvector so the canonical store + the
    # dense-vector projection live in one operational Postgres.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: canon
      POSTGRES_PASSWORD: canon
      POSTGRES_DB: flycanon
    ports:
      - "${PG_PORT:-5535}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canon -d flycanon"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6395}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Optional local embedding sidecar via Ollama. Off by default;
  # enable with ``docker compose --profile local-embeddings up`` (or
  # by setting COMPOSE_PROFILES=local-embeddings). The
  # ``ollama-pull`` init service pre-fetches the embedding model so
  # the first ingest doesn't pay a 60-second download.
  #
  # Switch the embedder by exporting:
  #   FLYCANON_EMBEDDING_MODEL=ollama:nomic-embed-text
  #   FLYCANON_EMBEDDING_DIMENSIONS=768
  #   FLYCANON_OLLAMA_BASE_URL=http://ollama:11434
  ollama:
    image: ollama/ollama:latest
    container_name: flycanon-ollama
    profiles: ["local-embeddings"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-pull:
    image: ollama/ollama:latest
    container_name: flycanon-ollama-pull
    profiles: ["local-embeddings"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'ollama pull "$$OLLAMA_EMBEDDING_MODEL" && echo "[ollama-pull] $$OLLAMA_EMBEDDING_MODEL ready"'
    restart: "no"

  api:
    build: *service-build
    image: flycanon:latest
    container_name: flycanon-api
    command: ["serve"]
    ports:
      - "${CANON_PORT:-8500}:8500"
    # Optional .env -- compose v2 honours ``required: false`` so the stack
    # boots even without a local .env (provider keys fall back to the host
    # shell env). ``task docker:up`` also auto-creates .env from env_template.
    env_file:
      - path: .env
        required: false
    environment:
      FLYCANON_DATABASE_URL: postgresql+asyncpg://canon:canon@postgres:5432/flycanon
      FLYCANON_REDIS_URL: redis://redis:6379/0
      FLYCANON_EDA_ADAPTER: postgres
      FLYCANON_EMBEDDING_MODEL: ${FLYCANON_EMBEDDING_MODEL:-openai:text-embedding-3-small}
      FLYCANON_EMBEDDING_DIMENSIONS: ${FLYCANON_EMBEDDING_DIMENSIONS:-1536}
      FLYCANON_ANSWER_MODEL: ${FLYCANON_ANSWER_MODEL:-anthropic:claude-sonnet-4-6}
      FLYCANON_OLLAMA_BASE_URL: ${FLYCANON_OLLAMA_BASE_URL:-http://ollama:11434}
      FLYCANON_CORPUS_PATH: /app/canon-data/corpus.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      RUN_MIGRATIONS: "true"
    volumes:
      - canon_data:/app/canon-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8500/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build: *service-build
    image: flycanon:latest
    container_name: flycanon-worker
    command: ["worker"]
    env_file:
      - path: .env
        required: false
    environment:
      FLYCANON_DATABASE_URL: postgresql+asyncpg://canon:canon@postgres:5432/flycanon
      FLYCANON_REDIS_URL: redis://redis:6379/0
      FLYCANON_EDA_ADAPTER: postgres
      FLYCANON_EMBEDDING_MODEL: ${FLYCANON_EMBEDDING_MODEL:-openai:text-embedding-3-small}
      FLYCANON_EMBEDDING_DIMENSIONS: ${FLYCANON_EMBEDDING_DIMENSIONS:-1536}
      FLYCANON_ANSWER_MODEL: ${FLYCANON_ANSWER_MODEL:-anthropic:claude-sonnet-4-6}
      FLYCANON_OLLAMA_BASE_URL: ${FLYCANON_OLLAMA_BASE_URL:-http://ollama:11434}
      FLYCANON_CORPUS_PATH: /app/canon-data/corpus.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      RUN_MIGRATIONS: "false"
    volumes:
      - canon_data:/app/canon-data
    depends_on:
      api:
        condition: service_healthy

  # Optional Gotenberg sidecar for high-fidelity Office -> PDF
  # conversion. Off by default -- the binary normaliser uses MarkItDown
  # in-process which is sufficient for DOCX / XLSX / PPTX / HTML.
  # Enable when source documents have complex layout (PowerPoint
  # decks with images, multi-tab spreadsheets, &c.) and you want the
  # PDF render path:
  #   docker compose --profile office up
  #   FLYCANON_OFFICE_CONVERTER=gotenberg
  #   FLYCANON_GOTENBERG_URL=http://gotenberg:3000
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: flycanon-gotenberg
    profiles: ["office"]
    ports:
      - "${GOTENBERG_PORT:-3500}:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  ollama_data:
  canon_data:
