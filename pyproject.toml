[project]
name = "flycanon"
# CalVer YY.MM.PP -- bumped per release. Note that PEP 440 normalises
# ``26.05.04`` -> ``26.5.4`` in the built wheel filename.
version = "26.5.5"
description = "Operational Knowledge Repository -- versioned, provenance-tracked canonical knowledge with hybrid retrieval and RAG, exposed as a standalone HTTP microservice over fireflyframework-pyfly and -agentic. Part of Firefly OperationOS, platform-agnostic by design."
readme = "README.md"
requires-python = ">=3.13"
# flycanon (the service) is proprietary -- no public license is granted.
# Only the SDKs under ``sdks/python`` and ``sdks/java`` are released
# under Apache-2.0; each carries its own LICENSE file.
authors = [
    { name = "Firefly Software Solutions Inc" },
]

dependencies = [
    # Firefly Framework runtime (DI, CQRS, EDA, web, observability, resilience,
    # actuator, data-relational, security). Pulled in with the extras we use
    # so a fresh ``uv sync`` is enough to boot the full stack.
    "pyfly[fastapi,observability,security,data-relational,postgresql,eda,redis,client,scheduling,cli]>=26.5.4",

    # GenAI metaframework -- FireflyAgent over pydantic-ai, plus the
    # corpus / hybrid-retrieval primitives the query stage uses
    # (SqliteCorpus + HybridRetriever live under
    # ``fireflyframework_agentic.rag``). The ``corpus-search`` extra
    # bundles MarkItDown (multi-format intake), the SQLite-vec vector
    # store backend, openai-embeddings, and sqlglot.
    "fireflyframework-agentic[rest,security,redis,corpus-search]>=26.5.11",

    # Source intake -- the high-fidelity per-format loaders + the
    # universal MarkItDown fallback. MarkItDown ships via the agentic
    # ``corpus-search`` extra above and covers DOCX / XLSX / PPTX /
    # PDF / HTML / CSV / JSON / XML / EPUB. The dedicated wheels
    # listed here back the specific loaders and the binary
    # normaliser:
    #
    # * ``python-docx`` -- :class:`DocxLoader` (Heading1-9 detection)
    #   + DOCX metadata (core.coreproperties).
    # * ``pypdf``        -- :class:`PdfGuard` encryption/corruption
    #   pre-flight; lightweight page count.
    # * ``pymupdf``      -- primary :class:`PdfLoader` text + per-page
    #   rendering for image-only PDFs (the flydocs approach: PyMuPDF
    #   first, Tesseract OCR fallback). MarkItDown is no longer on
    #   the PDF path.
    # * ``pypdfium2``    -- fallback PDF renderer for the image OCR
    #   path when PyMuPDF is unavailable.
    # * ``python-pptx``  -- PPTX metadata + native text extraction.
    # * ``openpyxl``     -- XLSX metadata + cell extraction.
    # * ``beautifulsoup4``+ ``lxml`` -- :class:`HtmlLoader`.
    # * ``Pillow`` + ``pillow-heif`` + ``cairosvg`` -- image format
    #   normalisation (HEIC / HEIF / AVIF / TIFF / BMP / SVG -> PNG)
    #   used by :class:`ImageNormalizer` and :class:`ImageLoader`.
    # * ``pytesseract`` -- :class:`ImageLoader` OCR. The runtime
    #   Dockerfile installs the ``tesseract`` binary + the common
    #   European language packs (``-spa``, ``-eng``, ``-fra``, ...).
    # * ``py7zr`` -- 7-Zip archive expansion. ``.zip`` and ``.tar``
    #   are stdlib.
    # * ``extract-msg`` -- Outlook ``.msg`` parsing. ``.eml`` uses
    #   stdlib ``email``.
    # * ``langdetect`` -- best-effort language detection on extracted
    #   text for the metadata extractor.
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pypdf>=4.3.0",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "Pillow>=11.0",
    "pillow-heif>=0.18",
    "cairosvg>=2.7",
    "pytesseract>=0.3.13",
    "py7zr>=0.22",
    "extract-msg>=0.51",
    "langdetect>=1.0.9",

    # HTTP client for outbound calls (webhooks, future SOTA monitors).
    "httpx>=0.28.0",
    "tenacity>=9.0.0",

    # Configuration.
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # Persistence stack. asyncpg drives the runtime (async engine);
    # psycopg is the sync sibling used by Alembic for migrations
    # (env.py rewrites ``+asyncpg`` -> ``+psycopg`` so a single
    # DATABASE_URL covers both). ``pgvector`` is core (not an extra)
    # because Postgres + the pgvector extension is the DEFAULT
    # vector backend -- the canonical store + the dense-vector
    # projection co-reside in one operational Postgres instance.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "aiosqlite>=0.22",
    "alembic>=1.14",
    "redis>=5.2",
    "pgvector>=0.3.6",

    # Structured logging + tracing.
    "structlog>=25.5.0",
]

[project.scripts]
flycanon = "flycanon.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "pyright>=1.1",
    "testcontainers[postgres,redis]>=4.0",
    "respx>=0.21",
    "httpx>=0.28",
    "reportlab>=4.2",
    "python-docx>=1.1",
]

# Optional layout-aware OCR via IBM Docling. Activates when
# ``FLYCANON_PDF_OCR_ENGINE=docling`` is set; otherwise the PDF
# pipeline uses PyMuPDF + Tesseract (same default as flydocs).
# Docling preserves multi-column / table structure better than
# Tesseract alone on complex layouts at the cost of a heavier
# dependency and slower first-page latency.
docling = [
    "docling>=2.0",
]

# Optional Chroma adapter (managed or self-hosted ChromaDB). Activates
# when FLYCANON_VECTOR_STORE=chroma.
chroma = [
    "chromadb>=0.5.0",
]

# Optional Qdrant adapter (self-hosted or Qdrant Cloud). Activates
# when FLYCANON_VECTOR_STORE=qdrant.
qdrant = [
    "qdrant-client>=1.12.0",
]

# Optional Pinecone adapter. Activates when FLYCANON_VECTOR_STORE=pinecone.
pinecone = [
    "pinecone>=5.0.0",
]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.uv.sources]
# Sibling-repo path sources -- mirror what the rest of operationOS does
# so both services boot from a fresh local checkout without needing the
# registry.
pyfly = { path = "../../fireflyframework/fireflyframework-pyfly", editable = true }
fireflyframework-agentic = { path = "../../fireflyframework/fireflyframework-agentic", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/flycanon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires docker compose stack (real Postgres / Redis)",
    "llm: requires a real LLM provider (OPENAI_API_KEY/ANTHROPIC_API_KEY/...). Skipped by default.",
]
addopts = "-v --tb=short -m 'not llm'"

[tool.ruff]
target-version = "py313"
line-length = 110
# CI clones the sibling firefly framework repos into ``./vendor/`` so
# the Dockerfile's BuildKit contexts resolve identically in local
# checkouts and in GitHub Actions. We don't lint third-party code on
# its way through our pipeline -- they have their own ruff config.
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Public DTOs / interface enums map directly onto the JSON wire
# contract we ship to callers. The mixedCase fields and Exception-
# suffix-less identifiers are intentional -- renaming them would break
# the API.
"src/flycanon/interfaces/**" = ["N801", "N811", "N815", "N818"]
# Domain exceptions on the CQRS handlers follow the framework's
# exception-naming convention (no ``Error`` suffix); renaming them
# would ripple through every controller advice mapping.
"src/flycanon/core/services/**" = ["N818"]
# Tests routinely build long inline DTOs; the line-length cap is a
# code-smell signal we don't enforce on test fixtures.
"tests/**" = ["E501"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["src/flycanon"]
exclude = ["tests/**", "**/__pycache__/**", "vendor/**"]

# Execution-environment overrides silence false positives that come
# from framework-level metaprogramming pyright can't follow. pyfly's
# ``Body[T]`` / ``Valid[T]`` / ``PathVar[T]`` / ``QueryParam[T]`` are
# runtime ``Generic[T]`` classes the framework unwraps at injection
# time -- the controller method sees the inner ``T``, but pyright
# (which can't follow the metaprogramming) sees the wrapper. Both
# ``reportArgumentType`` and ``reportAttributeAccessIssue`` end up
# firing on every controller; silence both here.
[[tool.pyright.executionEnvironments]]
root = "src/flycanon/web/controllers"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportOperatorIssue = "none"
